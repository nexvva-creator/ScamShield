services:
  - type: web
    name: scamshield-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: SCAMSHIELD_HOST
        value: 0.0.0.0
      - key: SCAMSHIELD_TRUST_PROXY
        value: "true"
      - key: SCAMSHIELD_DATABASE_REQUIRED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SCAMSHIELD_ADMIN_TOKEN
        generateValue: true
      - key: SCAMSHIELD_ALLOWED_ORIGINS
        sync: false
